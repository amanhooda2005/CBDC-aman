[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
cache_path = "cache"
allow_paths = [".."]
remappings = ["h3/=../h3-abt/contracts/", "h1/=../h1-zkopml-v2/contracts/", "forge-std/=lib/forge-std/src/"]
